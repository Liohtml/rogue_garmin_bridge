name: Build

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CIQ_SDK_VERSION: "9.3.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Connect IQ SDK
        uses: actions/cache@v4
        with:
          path: .ciq/connectiq-sdk-*
          key: ciq-sdk-${{ env.CIQ_SDK_VERSION }}

      - name: Install SDK and device definitions
        run: scripts/setup-sdk.sh

      - name: Build all devices and store package
        run: scripts/build.sh

      - name: Build unit tests
        run: scripts/build.sh --test fenix7

      - uses: actions/upload-artifact@v4
        with:
          name: EchoBike-${{ github.sha }}
          path: dist/
          if-no-files-found: error
